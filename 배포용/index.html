<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>울산광역시 고등학교 과목 편성 검색기</title>
<style>
:root{--bg:#f3f7fc;--fg:#111827;--muted:#6b7280;--border:#d9e1ec;--primary:#1d4ed8;--card:#ffffff;--coed:#2f80ed;--boy:#1e9e4a;--girl:#e8455f;}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;color:var(--fg);background:var(--bg)}
header{text-align:center;padding:28px 16px 10px}
header h1{margin:0;font-size:30px;letter-spacing:-0.5px}
header p{margin:6px 0 0;color:var(--muted);font-size:14px}
.searchbar{display:flex;gap:8px;justify-content:center;align-items:center;padding:14px 16px 10px;flex-wrap:wrap;position:relative;z-index:1000}
.searchbar select{height:46px;padding:0 14px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:15px;min-width:120px}
.subject-wrap{position:relative;width:min(520px,80vw);z-index:1001;overflow:visible}
.subject-wrap input{width:100%;height:46px;padding:0 44px 0 16px;border:1px solid var(--border);border-radius:10px;font-size:15px;background:#fff}
.subject-wrap input:focus{outline:2px solid #bfdbfe;border-color:var(--primary)}
.subject-wrap .clear{position:absolute;right:10px;top:9px;width:28px;height:28px;border:0;border-radius:50%;background:#e5e7eb;color:#374151;cursor:pointer;font-size:14px;display:none}
.ac{position:absolute;left:0;right:0;top:52px;background:#fff;border:1px solid var(--border);border-radius:12px;max-height:320px;overflow:auto;z-index:9999;display:none;box-shadow:0 10px 28px rgba(0,0,0,.12)}
.ac-title{padding:9px 14px 7px;color:var(--muted);font-size:12px;border-bottom:1px solid #eef2f7;font-weight:700}
.ac-item{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:1.35}
.ac-item:hover,.ac-item.active{background:#eff6ff}
.ac-item .ac-name{font-weight:500}
.ac-item .ac-name b{font-weight:800;color:#0b3d91}
.ac-item .ac-count{color:var(--muted);font-size:12px;white-space:nowrap}
.btn{height:46px;padding:0 18px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-size:15px;cursor:pointer}
.btn.ghost{background:#fff;color:#374151;border:1px solid var(--border)}
.status{text-align:center;color:var(--muted);font-size:13px;min-height:18px;padding:0 16px}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.9fr);gap:16px;padding:8px 16px 24px;max-width:1500px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
.mapbox{background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px;position:relative;min-height:560px;overflow:hidden}
.mapbox svg{width:100%;height:600px;display:block;background:radial-gradient(circle at 30% 20%,#e9f3fd 0,#f5f9fe 45%,#ffffff 100%);border-radius:10px;touch-action:manipulation}
.district{fill:#ffffff;stroke:#9aa6b5;stroke-width:1.2;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
.district:hover,.district.hover{fill:#ffe1b3}
.district.selected{fill:#fff7e8;stroke:#7c8798}
.district.dim{fill:#f1f4f8;stroke:#c8d0db;cursor:default}
.dlabel{font-size:12px;font-weight:600;fill:#374151;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.dlabel-faint{font-weight:800;fill:#7ea0c7;opacity:.16;text-anchor:middle;pointer-events:none;letter-spacing:2px}
.tip{pointer-events:none}
.tip rect{fill:#0b3d91;rx:5}
.tip text{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle}
.tip line{stroke:#0b3d91;stroke-width:1.5}
.tip circle{fill:#0b3d91}
.marker{cursor:pointer}
.marker circle.bg{stroke:#fff;stroke-width:1}
.marker text{font-size:9px;font-weight:600;fill:#1f2937;paint-order:stroke;stroke:#fff;stroke-width:1.6px;stroke-linejoin:round;pointer-events:none}
.marker.hl circle.bg{stroke:#111827;stroke-width:2}
.marker.hl text{font-weight:800;fill:#0b3d91}
.maptools{position:absolute;left:18px;top:18px;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
.maptools button{height:32px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:13px;cursor:pointer}
.legend{position:absolute;right:18px;bottom:18px;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;display:flex;gap:10px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.mapnote{position:absolute;left:18px;bottom:18px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.85);padding:3px 8px;border-radius:6px;max-width:60%}
.panel{display:flex;flex-direction:column;min-height:560px}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px}
.panel-head h2{margin:0;font-size:18px}
.count{background:#fff3c4;color:#8a5a00;font-weight:700;padding:4px 10px;border-radius:6px;font-size:13px}
.cards{display:flex;flex-direction:column;gap:12px;max-height:600px;overflow:auto;padding-right:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:box-shadow .15s,border-color .15s;cursor:default}
.card.hl{border-color:#0b3d91;box-shadow:0 0 0 2px #dbe6f7}
.card h3{margin:0 0 10px;font-size:19px}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{background:#f1f4f8;color:#374151;border-radius:6px;padding:4px 9px;font-size:12px}
.badge.coed{background:#e8f1fd;color:#1b5fc1}.badge.boy{background:#e6f6ec;color:#177a3a}.badge.girl{background:#fde8ec;color:#c2314a}
.sep{color:#cbd5e1}
.courses{margin-top:12px;border-top:1px dashed var(--border);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.course{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.course .sub{font-weight:700;font-size:14px;color:#0b3d91}
.course .meta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#f8fafc;border:1px solid var(--border);border-radius:5px;padding:2px 7px;font-size:12px}
.chip.cat0{background:#eef2ff;border-color:#c7d2fe;color:#3730a3}.chip.cat1{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.chip.cat2{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 16px 30px}
/* ===== 학교 카드 액션 (편제표 다운로드 / 시뮬레이터) ===== */
.card{cursor:pointer}
.sch-actions{display:none;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);flex-wrap:wrap}
.card.open .sch-actions{display:flex}
.sch-act{flex:1;min-width:140px;display:flex;align-items:center;justify-content:center;gap:7px;
  height:42px;border:0;border-radius:9px;font-size:13.5px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:filter .15s}
.sch-act:hover{filter:brightness(1.07)}
.sch-act.dl{background:#e8f1fd;color:#1b5fc1}
.sch-act.sim{background:#e85d2f;color:#fff}
.sch-act[disabled]{background:#f1f4f8;color:#9aa6b5;cursor:not-allowed;filter:none}
.sch-act svg{width:16px;height:16px;flex:none}
.sch-hint{width:100%;font-size:11.5px;color:var(--muted);margin-top:2px}
.card .tap{font-size:11.5px;color:#9aa6b5;margin-top:8px}
.card.open .tap{display:none}

/* ===== 시뮬레이터 오버레이 ===== */
#simOv{display:none;position:fixed;inset:0;z-index:3000;background:#f5f7fa;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:#1e2d3d;font-size:14px;overflow:hidden;flex-direction:column}
#simOv.open{display:flex}
#simOv *{box-sizing:border-box}
#simOv .sim-header{background:#1a3a5c;padding:12px 16px 10px;text-align:center;position:relative;flex:none}
#simOv .sim-header h1{margin:0;font-size:15px;font-weight:800;color:#fff;line-height:1.4}
#simOv .sim-header h1 small{display:block;font-size:10px;font-weight:400;color:rgba(255,255,255,.62);margin-top:3px}
#simOv .sim-close{position:absolute;right:8px;top:8px;background:none;border:0;color:rgba(255,255,255,.85);
  font-size:22px;line-height:1;padding:4px 9px;cursor:pointer;border-radius:8px}
#simOv .sim-close:hover{background:rgba(255,255,255,.12)}
#simOv .sem-nav{display:flex;overflow-x:auto;background:#fff;border-bottom:2px solid #d0d8e4;flex:none;scrollbar-width:none}
#simOv .sem-nav-in{display:flex;flex:1;max-width:760px;min-width:450px;margin:0 auto}
#simOv .sem-nav::-webkit-scrollbar{display:none}
#simOv .sem-tab{flex:1;min-width:74px;padding:10px 0;font-size:12px;font-weight:700;color:#6b7c93;
  background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit}
#simOv .sem-tab.active{color:#1a3a5c;border-bottom-color:#e85d2f}
#simOv .sem-tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#e85d2f;margin-left:4px;vertical-align:middle}
#simOv .sem-tab.done .dot{background:#059669}
#simOv .sim-main{flex:1;overflow-y:auto;padding:10px 10px 78px;-webkit-overflow-scrolling:touch}
#simOv .sim-in{max-width:760px;margin:0 auto}

#simOv .sum-bar{background:#1a3a5c;color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
#simOv .sum-bar .lbl{font-size:10px;opacity:.7;margin-bottom:2px}
#simOv .sum-bar .val{font-size:20px;font-weight:800}
#simOv .sum-bar .unit{font-size:10px;margin-left:2px;opacity:.85}
#simOv .sum-bar .mid{text-align:center}
#simOv .sum-bar .rt{text-align:right}

#simOv .notice{background:#fff4ec;border:1px solid #f6c9ad;color:#a8420f;border-radius:9px;
  padding:9px 12px;font-size:11.5px;line-height:1.55;margin-bottom:10px}
#simOv .notice.ok{background:#ecfdf5;border-color:#a7f3d0;color:#047857}

#simOv .g-card{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(26,58,92,.08);
  margin-bottom:10px;overflow:hidden;border:1px solid #d0d8e4}
#simOv .g-head{background:#1a3a5c;color:#fff;padding:8px 12px;font-size:13px;font-weight:700;
  display:flex;align-items:center;gap:6px}
#simOv .g-bar{display:inline-block;width:4px;height:13px;background:#e85d2f;border-radius:2px;flex:none}
#simOv .g-head .rt{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
  background:rgba(255,255,255,.16)}
#simOv .g-head .rt.done{background:#059669}
#simOv .g-note{padding:7px 12px;font-size:11px;color:#6b7c93;background:#f8fafc;border-bottom:1px solid #eaeff6;line-height:1.5}
#simOv .row-list{padding:6px;display:flex;flex-direction:column;gap:5px}

#simOv .e-row{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;
  background:#f8fafc;border-radius:7px;padding:7px 9px;border:1px solid #e8edf4}
#simOv .e-row.pick{cursor:pointer}
#simOv .e-row.pick:hover{border-color:#a8c4dd;background:#f2f7fc}
#simOv .e-row.on{background:#eaf7f2;border-color:#a8d8c8}
#simOv .e-row.dim{opacity:.45}
#simOv .e-row.lock{background:#f4f6f9;border-style:dashed}
#simOv .bx{width:19px;height:19px;border-radius:5px;border:1.5px solid #c3cedd;background:#fff;
  display:grid;place-items:center}
#simOv .e-row.on .bx{background:#0d7a5a;border-color:#0d7a5a}
#simOv .e-row.on .bx::after,#simOv .e-row.lock .bx::after{content:"";width:4.5px;height:8.5px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
#simOv .e-row.lock .bx{background:#9aa9bb;border-color:#9aa9bb}
#simOv .nm{font-weight:700;font-size:12.5px;line-height:1.35;word-break:keep-all}
#simOv .e-row.on .nm{color:#0d7a5a}
#simOv .mt{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
#simOv .tg{font-size:9.5px;padding:1px 5px;border-radius:4px;background:#eef2f7;color:#6b7c93;border:1px solid #e2e8f0}
#simOv .tg.ex{background:#fff4e6;color:#b45309;border-color:#fcd9a8;font-weight:700}
#simOv .cr{font-size:11px;color:#6b7c93;white-space:nowrap}
#simOv .cr b{font-size:14px;color:#1a3a5c;font-weight:800}

#simOv .btn-bar{position:absolute;bottom:0;left:0;right:0;z-index:20;padding:9px 12px;
  background:rgba(245,247,250,.97);border-top:1px solid #d0d8e4;display:flex;gap:8px}
#simOv .btn-bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px;width:100%}
#simOv .btn-bar button{border:0;border-radius:28px;font-size:14px;font-weight:800;cursor:pointer;
  padding:12px 16px;font-family:inherit}
#simOv .b-reset{background:#6b7c93;color:#fff;white-space:nowrap}
#simOv .b-check{flex:1;background:#e85d2f;color:#fff}
#simOv .b-print{flex:1;background:#1a3a5c;color:#fff}

/* 점검 결과 모달 */
#simOv .modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;
  overflow-y:auto;padding:12px 8px 24px}
#simOv .modal-ov.open{display:block}
#simOv .modal-box{background:#fff;border-radius:14px;width:100%;max-width:760px;margin:0 auto;
  overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.25)}
#simOv .modal-hd{background:#1a3a5c;color:#fff;padding:13px 14px;display:flex;justify-content:space-between;align-items:center}
#simOv .modal-hd h2{margin:0;font-size:14px;font-weight:800}
#simOv .modal-bd{padding:12px}
#simOv .modal-ft{padding:10px 12px 14px;border-top:1px solid #d0d8e4;display:flex;gap:8px;justify-content:flex-end}
#simOv .b-dl{background:#1a3a5c;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:12px;
  font-weight:700;cursor:pointer;font-family:inherit}
#simOv .sec-title{font-size:12px;font-weight:800;color:#1a3a5c;border-left:4px solid #e85d2f;
  padding-left:7px;margin:14px 0 7px}
#simOv .sec-title:first-child{margin-top:0}
#simOv .chk-tbl{width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d8e4}
#simOv .chk-tbl th{background:#1a3a5c;color:#fff;padding:7px 5px;font-weight:700;text-align:center;font-size:10px}
#simOv .chk-tbl td{padding:6px;border-bottom:1px solid #eaeff6}
#simOv .chk-tbl tr:last-child td{border-bottom:none}
#simOv .chk-tbl tr:nth-child(even) td{background:#f8fafc}
#simOv .chk-tbl td:first-child{font-weight:700;color:#1a3a5c}
#simOv .tc{text-align:center}
#simOv .res{font-weight:800}
#simOv .ok{color:#059669}
#simOv .fail{color:#dc2626}
#simOv .chart-wrap{background:#f8fafc;border-radius:10px;padding:10px;border:1px solid #d0d8e4}
#simOv .c-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
#simOv .c-row:last-child{margin-bottom:0}
#simOv .c-lbl{width:86px;flex:none;font-size:10px;font-weight:700;color:#1a3a5c;text-align:right;line-height:1.3}
#simOv .c-bar-wrap{flex:1;background:#e8edf4;border-radius:20px;height:17px;overflow:hidden;position:relative}
#simOv .c-bar{height:100%;border-radius:20px;display:flex;align-items:center;justify-content:flex-end;padding-right:5px}
#simOv .c-bar-val{font-size:9px;font-weight:800;color:#fff;white-space:nowrap}
#simOv .c-req{position:absolute;top:0;bottom:0;width:2px;background:#e85d2f;opacity:.85}
#simOv .c-right{width:56px;flex:none;font-size:9px;color:#6b7c93}
#simOv .sem-chips{display:flex;flex-wrap:wrap;gap:6px}
#simOv .s-chip{padding:5px 10px;border-radius:18px;font-size:11px;font-weight:700;border:1px solid}
#simOv .s-chip.ok{background:#ecfdf5;border-color:#a7f3d0;color:#059669}
#simOv .s-chip.fail{background:#fef2f2;border-color:#fca5a5;color:#dc2626}
#simOv .subj-wrap{overflow-x:auto;margin-top:4px}
#simOv .subj-tbl{width:100%;border-collapse:collapse;font-size:10px;min-width:430px;border:1px solid #d0d8e4}
#simOv .subj-tbl th{background:#1a3a5c;color:#fff;padding:6px 4px;font-weight:700;text-align:center;font-size:9px;white-space:nowrap}
#simOv .subj-tbl td{padding:5px 4px;border-bottom:1px solid #eaeff6;vertical-align:top}
#simOv .subj-tbl tr:nth-child(even) td{background:#f8fafc}
#simOv .subj-tbl td:first-child{font-weight:700;color:#1a3a5c;white-space:nowrap;text-align:center}
#simOv .s-item{display:block;font-size:9.5px;line-height:1.6}
#simOv .s-item.sel{color:#0d7a5a;font-weight:700}
#simOv .s-item .st{color:#b45309}
#simOv .misc-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#simOv .misc-card{background:#f8fafc;border-radius:8px;padding:9px;border:1px solid #d0d8e4}
#simOv .mc-lbl{font-size:9px;color:#6b7c93;margin-bottom:3px}
#simOv .mc-val{font-size:12px;font-weight:700}
@media (max-width:520px){
  #simOv .sum-bar .mid{display:none}
  #simOv .misc-grid{grid-template-columns:1fr}
}
@media print{
  body>*:not(#simOv){display:none!important}
  #simOv{position:static;display:block!important;background:#fff}
  #simOv .sim-header,#simOv .sem-nav,#simOv .btn-bar,#simOv .sim-main{display:none!important}
  #simOv .modal-ov{display:block!important;position:static;background:none;padding:0;overflow:visible}
  #simOv .modal-box{box-shadow:none;max-width:none}
  #simOv .modal-ft{display:none!important}
}
#simOv .modal-hd .b-cl{background:none;border:0;color:rgba(255,255,255,.85);font-size:20px;
  cursor:pointer;padding:0 4px;line-height:1;font-family:inherit}
#simOv .modal-hd .b-cl:hover{color:#fff}

</style>
</head>
<body>
<header>
  <h1>울산광역시 고등학교 과목 편성 검색기</h1>
  <p>2026학년도 신입생 교육과정 편제표 기준 · 과목명을 검색하면 해당 과목을 편성한 학교를 확인할 수 있습니다<br>오른쪽 학교 카드를 누르면 편제표를 내려받거나 과목 선택 시뮬레이터를 실행할 수 있습니다</p>
</header>

<div class="searchbar">
  <select id="guSel" aria-label="구군 선택">
    <option value="">전체</option><option>남구</option><option>중구</option><option>북구</option><option>동구</option><option>울주군</option>
  </select>
  <div class="subject-wrap">
    <input id="subj" type="text" placeholder="과목명을 입력하세요 (예: 미적분Ⅰ, 정보, 세계사)" autocomplete="off">
    <button class="clear" id="clearBtn" title="지우기">✕</button>
    <div class="ac" id="ac"></div>
  </div>
  <button class="btn" id="searchBtn">검색</button>
  <button class="btn ghost" id="resetBtn">초기화</button>
</div>
<div class="status" id="status"></div>

<main>
  <section class="mapbox">
    <div class="maptools">
      <button id="fullBtn">전체 지도</button>
    </div>
    <svg id="map" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

"file": "호계고등학교 2026학년도 신입생 교육과정 편제표.xlsx", "mime": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "ext": ".xlsx"}, "화봉고등학교": {"file": "화봉고등학교 2026학년도 신입생 교육과정 편제표.xlsx", "mime": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "ext": ".xlsx"}, "화암고등학교": {"file": "화암고등학교 2026학년도 신입생 교육과정 편제표.pdf", "mime": "application/pdf", "ext": ".pdf"}, "효정고등학교": {"file": "효정고등학교 2026학년도 신입생 교육과정 편제표.xlsx", "mime": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "ext": ".xlsx"}};

   링크가 있으면 내장 파일·편제표 폴더보다 먼저 사용합니다.
   예) "강동고등학교": "https://drive.google.com/uc?export=download&id=파일ID" */
const CURR_LINKS={};
/* ===== 과목 선택 시뮬레이터 (2022 개정 교육과정) ===== */
(function(){
const SEMS=['1-1','1-2','2-1','2-2','3-1','3-2'];
const SEM_LABEL={'1-1':'1학년 1학기','1-2':'1학년 2학기','2-1':'2학년 1학기','2-2':'2학년 2학기','3-1':'3학년 1학기','3-2':'3학년 2학기'};
const TAB_LABEL={'1-1':'1-1학기','1-2':'1-2학기','2-1':'2-1학기','2-2':'2-2학기','3-1':'3-1학기','3-2':'3-2학기'};
/* 2022 개정 교육과정 필수 이수 학점 기준 */
const CHECK_GROUPS=[
  {label:'국어',areas:['국어'],min:8},
  {label:'수학',areas:['수학'],min:8},
  {label:'영어',areas:['영어'],min:8},
  {label:'한국사',areas:['사회'],hsOnly:true,min:6},
  {label:'사회',areas:['사회'],noHS:true,min:8},
  {label:'과학',areas:['과학'],min:10},
  {label:'체육',areas:['체육'],min:10},
  {label:'예술',areas:['예술'],min:10},
  {label:'기술·가정/정보/제2외국어/한문/교양',areas:['기술·가정_정보','제2외국어_한문','교양'],min:16}
];
const TOTAL_MIN=174, KYE_MAX=85;
const HIER=[{pre:'미적분Ⅰ',post:'미적분Ⅱ'},{pre:'영어Ⅰ',post:'영어Ⅱ'}];
const AREA_SHORT={'기술·가정_정보':'기술·가정/정보','제2외국어_한문':'제2외국어/한문'};

let S=null;              // 현재 학교 데이터
let sem='1-1';           // 현재 학기
let picks={};            // 'sem|groupId' -> Set(과목명)

const E=s=>document.getElementById(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const isHS=n=>n.indexOf('한국사')===0;
const areaName=a=>AREA_SHORT[a]||a;

const gkey=g=>g.key||g.id;
function picked(sk,gid){const k=sk+'|'+gid;return picks[k]||(picks[k]=new Set());}
function groupOK(sk,g){const n=picked(sk,gkey(g)).size;return g.optional?n<=g.take:n===g.take;}
function semOK(sk){return S.semesters[sk].groups.every(g=>groupOK(sk,g));}
function semSubjects(sk){
  const d=S.semesters[sk],out=[];
  d.fixed.forEach(f=>out.push(Object.assign({},f,{pick:false})));
  d.groups.forEach(g=>{const p=picked(sk,gkey(g));
    g.subjects.forEach(s=>{if(p.has(s.name))out.push(Object.assign({},s,{pick:true,gid:g.id}));});});
  return out;
}
const semCredit=sk=>semSubjects(sk).reduce((a,b)=>a+b.credit,0);
function allSubjects(){const o=[];SEMS.forEach(k=>semSubjects(k).forEach(s=>o.push(Object.assign({},s,{sem:k}))));return o;}

/* ---------- 화면 ---------- */
function openSim(name){
  S=SIM_DATA.schools[name];
  if(!S){alert('아직 이 학교의 시뮬레이터 자료가 준비되지 않았습니다.');return;}
  sem='1-1';picks={};
  E('simTitle').innerHTML=esc(S.name)+'<small>'+esc([S.gu,S.found,S.type,S.coed].filter(Boolean).join(' · '))+
    ' &nbsp;|&nbsp; 2026학년도 신입생 교육과정 · 과목 선택 시뮬레이터</small>';
  E('simOv').classList.add('open');
  document.body.style.overflow='hidden';
  renderTabs();renderSem();
}
function closeSim(){
  E('simOv').classList.remove('open');E('simModal').classList.remove('open');
  document.body.style.overflow='';
}
function renderTabs(){
  E('semNav').innerHTML=SEMS.map(k=>{
    const has=S.semesters[k].groups.length>0, done=semOK(k);
    return '<button class="sem-tab'+(k===sem?' active':'')+(done?' done':'')+'" data-k="'+k+'">'+
      TAB_LABEL[k]+(has?'<span class="dot"></span>':'')+'</button>';
  }).join('');
  [].forEach.call(E('semNav').children,b=>b.onclick=()=>{sem=b.dataset.k;renderTabs();renderSem();
    E('simMain').scrollTop=0;});
}
function renderSem(){
  const d=S.semesters[sem], box=E('simMain').querySelector('.sim-in');
  const cur=semCredit(sem), tgt=d.targetLo===d.targetHi?d.targetLo:(d.targetLo+'~'+d.targetHi);
  const nsel=semSubjects(sem).filter(s=>s.pick).length;
  let h='<div class="sum-bar">'+
    '<div><div class="lbl">'+SEM_LABEL[sem]+' 이수 학점</div><div><span class="val">'+cur+'</span><span class="unit">/ '+tgt+'학점</span></div></div>'+
    '<div class="mid"><div class="lbl">선택한 과목</div><div><span class="val">'+nsel+'</span><span class="unit">과목</span></div></div>'+
    '<div class="rt"><div class="lbl">3년 누적</div><div><span class="val">'+allSubjects().reduce((a,b)=>a+b.credit,0)+'</span><span class="unit">/ '+TOTAL_MIN+'학점</span></div></div></div>';

  if(d.groups.length){
    const left=d.groups.filter(g=>!groupOK(sem,g));
    h+= left.length
      ? '<div class="notice">아직 '+left.map(g=>'<b>선택군 '+esc(g.id)+'</b>에서 '+(g.take-picked(sem,gkey(g)).size)+'과목').join(', ')+' 더 골라야 합니다.</div>'
      : '<div class="notice ok">이 학기 선택이 모두 끝났습니다. 위쪽 탭에서 다음 학기로 넘어가세요.</div>';
  }else if(d.fixed.length===0){
    h+='<div class="notice">이 학기에 편성된 과목이 없습니다.</div>';
  }else{
    h+='<div class="notice ok">이 학기는 학교 지정 과목으로 모두 채워집니다. 고를 과목이 없습니다.</div>';
  }

  if(d.fixed.length){
    h+='<div class="g-card"><div class="g-head"><span class="g-bar"></span>학교 지정 과목'+
       '<span class="rt">'+d.fixed.length+'과목 · '+d.fixed.reduce((a,b)=>a+b.credit,0)+'학점</span></div>';
    if((d.crossNote||[]).length) h+=crossNoteHTML(d.crossNote);
    h+='<div class="row-list">'+d.fixed.map(f=>row(f,{lock:true})).join('')+'</div></div>';
  }

  d.groups.forEach(g=>{
    const p=picked(sem,gkey(g)), ok=groupOK(sem,g), full=p.size>=g.take;
    h+='<div class="g-card"><div class="g-head"><span class="g-bar"></span>'+
       (g.cross?'학기 교차 · ':'')+'선택군 '+esc(g.id)+
       ' · '+(g.optional?'희망자만 선택':g.take+'과목 선택')+
       '<span class="rt'+(ok?' done':'')+'">'+p.size+' / '+g.take+'</span></div>'+
       (g.cross?'<div class="g-note">여기서 고른 과목을 짝 과목과 학기를 나누어 이수합니다 (반에 따라 순서가 바뀔 수 있습니다).</div>':'')+
       (g.optional?'<div class="g-note">듣고 싶은 학생만 선택하는 과목입니다. 원본 편제표에 택N이 적혀 있지 않아 희망자 선택으로 처리했습니다.</div>':'')+
       '<div class="row-list">'+g.subjects.map(s=>row(s,{pick:true,on:p.has(s.name),
         dim:full&&!p.has(s.name),gid:gkey(g)})).join('')+'</div></div>';
  });
  box.innerHTML=h;

  [].forEach.call(box.querySelectorAll('.e-row.pick'),el=>{
    el.onclick=()=>{
      const p=picked(sem,el.dataset.gid), n=el.dataset.name;
      if(p.has(n))p.delete(n); else{ if(p.size>=+el.dataset.take)return; p.add(n); }
      renderTabs();renderSem();
    };
  });
}
/* 학기 교차 편성 안내: "1학년 1학기 음악·미술 / 1학년 2학기 정보" */
function crossNoteHTML(notes){
  return '<div class="g-note">'+notes.map(function(n){
    const parts=(n.sems||[]).filter(k=>n.bySem[k])

function runCheck(){
  const all=allSubjects();
  const byArea={};all.forEach(s=>{byArea[s.area]=(byArea[s.area]||0)+s.credit;});
  const hs=all.filter(s=>isHS(s.name)).reduce((a,b)=>a+b.credit,0);
  const rows=CHECK_GROUPS.map(cg=>{
    let c=cg.areas.reduce((a,k)=>a+(byArea[k]||0),0);
    if(cg.hsOnly)c=hs; else if(cg.noHS)c=c-hs;
    return{label:cg.label,credit:c,min:cg.min,ok:c>=cg.min,d:c-cg.min};
  });
  const tot=all.reduce((a,b)=>a+b.credit,0);
  const kye=(byArea['국어']||0)+(byArea['수학']||0)+(byArea['영어']||0);
  const names=all.map(s=>s.name);
  const hier=HIER.filter(h=>names.indexOf(h.post)>=0)
    .map(h=>({label:h.post,pre:h.pre,ok:names.indexOf(h.pre)>=0}));
  const semInfo=SEMS.map(k=>{
    const d=S.semesters[k];
    return{k:k,credit:semCredit(k),ok:semOK(k),
      need:d.groups.filter(g=>!groupOK(k,g)).map(g=>g.id+'('+picked(k,gkey(g)).size+'/'+g.take+')')};
  });
  return{rows:rows,tot:tot,totOk:tot>=TOTAL_MIN,kye:kye,kyeOk:kye<=KYE_MAX,
         hier:hier,semInfo:semInfo,all:all};
}

/* ---------- 편제표 다운로드 ---------- */
function downloadCurriculum(name){
  const f=CURR_FILES[name]||{};
  // 1순위: 링크가 지정돼 있으면 그곳에서 받는다 (구글 드라이브 등)
  const link=(typeof CURR_LINKS!=='undefined')?CURR_LINKS[name]:null;
  if(link){ window.open(link,'_blank','noopener'); return; }
  // 2순위: HTML에 내장돼 있지 않으면 옆의 "편제표" 폴더에서 찾는다
  if(!f.b64){
    const a=document.createElement('a');
    a.href=CURR_DIR+'/'+encodeURIComponent(name)+(f.ext||'.xlsx');
    a.download=f.file||(name+' 교육과정 편제표'+(f.ext||'.xlsx'));
    document.body.appendChild(a);a.click();
    setTimeout(()=>document.body.removeChild(a),400);
    return;
  }
  const bin=atob(f.b64), len=bin.length, buf=new Uint8Array(len);
  for(let i=0;i<len;i++)buf[i]=bin.charCodeAt(i);
  const blob=new Blob([buf],{type:f.mime||'application/octet-stream'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url;a.download=f.file;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},400);
}

<script>
(function(){
const $=s=>document.querySelector(s);
const svg=$('#map'), gD=$('#gDistricts'), gF=$('#gFaint'), gL=$('#gLabels'), gM=$('#gMarkers'), gT=$('#gTip');
const GUS=['남구','중구','북구','동구','울주군'];
const COLORS={'남여공학':'#2f80ed','남':'#1e9e4a','여':'#e8455f'};
const ICON_DL=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`, ICON_SIM=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`;
const schoolsByName={}; DATA.schools.forEach(s=>schoolsByName[s.name]=s);
DATA.programs.forEach(p=>{p.info=schoolsByName[p.school];});

/* ---------- 투영 ---------- */
const K=1000, COS=Math.cos(35.5*Math.PI/180);
let ORIGIN={lon:128.96,lat:35.74};
const px=lon=>(lon-ORIGIN.lon)*COS*K, py=lat=>(ORIGIN.lat-lat)*K;
const toLon=x=>x/(COS*K)+ORIGIN.lon, toLat=y=>ORIGIN.lat-y/K;
let DIST=DATA.districts; // {name:{poly:[[lon,lat]] or polys:[[...]], label:[lon,lat]}}

/* ---------- 상태 ---------- */
let selectedGu='', query='', matchedSubjects=null, resultPrograms=[];
let openSchool='';
let fullBox=null, curBox=null, animId=null;

/* ---------- 지도 그리기 ---------- */
function ringsOf(d){return d.polys?d.polys:[d.poly];}
function pathOf(d){return ringsOf(d).map(r=>'M'+r.map(p=>px(p[0]).toFixed(1)+','+py(p[1]).toFixed(1)).join('L')+'Z').join('');}
function bboxOf(rings){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;rings.forEach(r=>r.forEach(p=>{const x=px(p[0]),y=py(p[1]);if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y;}));return{x:x0,y:y0,w:x1-x0,h:y1-y0};}
function pad(b,f){const dx=b.w*f,dy=b.h*f;return{x:b.x-dx,y:b.y-dy,w:b.w+2*dx,h:b.h+2*dy};}
function fitAspect(b){const R=svg.clientWidth/(svg.clientHeight||600)||1.1;let{x,y,w,h}=b;if(w/h<R){const nw=h*R;x-=(nw-w)/2;w=nw;}else{const nh=w/R;y-=(nh-h)/2;h=nh;}return{x,y,w,h};}
function setBox(b){curBox=b;svg.setAttribute('viewBox',`${b.x} ${b.y} ${b.w} ${b.h}`);}
function animateTo(b){b=fitAspect(b);if(animId)cancelAnimationFrame(animId);const s=curBox||b,t0=performance.now(),D=450;const ease=t=>1-Math.pow(1-t,3);function step(t){const k=Math.min(1,(t-t0)/D),e=ease(k);setBox({x:s.x+(b.x-s.x)*e,y:s.y+(b.y-s.y)*e,w:s.w+(b.w-s.w)*e,h:s.h+(b.h-s.h)*e});if(k<1)animId=requestAnimationFrame(step);else animId=null;}animId=requestAnimationFrame(step);}

function buildMap(){
  gD.innerHTML='';gL.innerHTML='';gF.innerHTML='';
  const all=[];GUS.forEach(g=>ringsOf(DIST[g]).forEach(r=>all.push(r)));
  fullBox=pad(bboxOf(all),0.05);
  GUS.forEach(g=>{
    const d=DIST[g];
    const p=document.createElementNS(svg.namespaceURI,'path');
    p.setAttribute('d',pathOf(d));p.setAttribute('class','district');p.dataset.gu=g;
    p.addEventListener('mouseenter',e=>showTip(g));
    p.addEventListener('mouseleave',hideTip);
    p.addEventListener('click',e=>selectGu(g,true));
    gD.appendChild(p);
    const t=document.createElementNS(svg.namespaceURI,'text');
    t.setAttribute('x',px(d.label[0]));t.setAttribute('y',py(d.label[1]));t.setAttribute('class','dlabel');t.textContent=g;t.dataset.gu=g;
    gL.appendChild(t);
  });
  setBox(fitAspect(fullBox));
  refreshMap();
}
function districtCount(g){
  if(matchedSubjects){const set=new Set();resultPrograms.forEach(p=>{if(p.info.gu===g)set.add(p.school);});return set.size;}
  return DATA.schools.filter(s=>s.gu===g).length;
}
function showTip(g){
  if(selectedGu&&selectedGu!==g)return;
  const d=DIST[g];const x=px(d.label[0]),y=py(d.label[1]);
  const scale=curBox.w/ (fullBox.w||1);
  const n=districtCount(g);
  const txt=matchedSubjects?`${n}개교 편성`:`${n}개교`;
  const w=(txt.length*7.5+18)*scale,h=22*scale,gap=(selectedGu?60:44)*scale;
  gT.innerHTML=`<circle cx="${x}" cy="${y}" r="${3*scale}"/><line x1="${x}" y1="${y}" x2="${x}" y2="${y-gap}"/><rect x="${x-w/2}" y="${y-gap-h}" width="${w}" height="${h}" rx="${5*scale}"/><text x="${x}" y="${y-gap-h/2+4*scale}" style="font-size:${12*scale}px">${txt}</text>`;
  gT.style.display='';
  gD.querySelectorAll('.district').forEach(p=>p.classList.toggle('hover',p.dataset.gu===g&&!selectedGu));
}
function hideTip(){gT.style.display='none';gD.querySelectorAll('.district').forEach(p=>p.classList.remove('hover'));}

function refreshMap(){
  gD.querySelectorAll('.district').forEach(p=>{const g=p.dataset.gu;p.classList.toggle('selected',selectedGu===g);p.classList.toggle('dim',!!selectedGu&&selectedGu!==g);});
  gL.querySelectorAll('.dlabel').forEach(t=>{t.style.display=selectedGu?'none':'';});
  gF.innerHTML='';gM.innerHTML='';
  if(selectedGu){
    const d=DIST[selectedGu];const b=bboxOf(ringsOf(d));
    const fs=Math.min(b.w,b.h)*0.26;
    const t=document.createElementNS(svg.namespaceURI,'text');
    t.setAttribute('x',px(d.label[0]));t.setAttribute('y',py(d.label[1])+fs*0.35);t.setAttribute('class','dlabel-faint');t.style.fontSize=fs+'px';t.textContent=selectedGu;
    gF.appendChild(t);
    drawMarkers(selectedGu,b);
  }
}
function visibleSchoolsIn(g){
  if(matchedSubjects){const set=new Set();resultPrograms.forEach(p=>{if(p.info.gu===g)set.add(p.school);});return DATA.schools.filter(s=>set.has(s.name));}
  return DATA.schools.filter(s=>s.gu===g);
}
function drawMarkers(g,b){
  const scale=Math.max(b.w,b.h)/220; // 구군 크기에 따라 마커 크기 보정
  const r=3.6*scale, fs=5.2*scale, gap=3.5*scale;
  const schools=visibleSchoolsIn(g).filter(s=>SCHOOL_COORDS[s.name]);
  const placed=[];

  // 학교명은 좌/우 한쪽에 고정하지 않고, 기존 방향을 우선하되
  // 이미 배치된 학교명과 겹치면 상·하·좌·우 방향을 자동으로 바꿉니다.
  const candidatesFor=(side)=>{
    const base={R:0,L:1,T:2,B:3}[side]??0;
    const order=[side,'R','L','T','B'].filter((v,i,a)=>a.indexOf(v)===i);
    // 기존 방향을 먼저 시도하고, 나머지는 거리상 자연스러운 순서로 시도
    const rest=['R','L','T','B'].filter(v=>!order.includes(v));
    return order.concat(rest);
  };
  const rectFor=(x,y,dir,w)=>{
    if(dir==='R') return {x:x+r+gap,y:y-fs*.82,w,h:fs};
    if(dir==='L') return {x:x-r-gap-w,y:y-fs*.82,w,h:fs};
    if(dir==='T') return {x:x-w/2,y:y-r-gap-fs,w,h:fs};
    return {x:x-w/2,y:y+r+gap,w,h:fs};
  };
  const overlap=(a,z,pad=0)=>!(a.x+a.w+pad<z.x||z.x+z.w+pad<a.x||a.y+a.h+pad<z.y||z.y+z.h+pad<a.y);

  schools.forEach(s=>{
    const c=SCHOOL_COORDS[s.name];
    const x=px(c[0]),y=py(c[1]);
    const col=COLORS[s.coed]||'#64748b';
    const w=Math.max(fs*2.2,s.short.length*fs*.95);
    let best=null;
    for(const dir of candidatesFor(c[2]||'R')){
      const rect=rectFor(x,y,dir,w);
      let score=0;
      // 다른 학교명과 겹치면 큰 벌점
      placed.forEach(z=>{if(overlap(rect,z.rect,0.35*scale))score+=1000;});
      // 학교 아이콘과도 겹치지 않도록 확인
      schools.forEach(o=>{
        if(o===s)return;
        const oc=SCHOOL_COORDS[o.name];
        const ox=px(oc[0]),oy=py(oc[1]);
        const cx=Math.max(rect.x,Math.min(ox,rect.x+rect.w));
        const cy=Math.max(rect.y,Math.min(oy,rect.y+rect.h));
        if(Math.hypot(ox-cx,oy-cy)<r+0.8*scale)score+=500;
      });
      // 지도 밖으로 나가는 경우 약한 벌점
      if(rect.x<b.x)score+=(b.x-rect.x)*20;
      if(rect.y<b.y)score+=(b.y-rect.y)*20;
      if(rect.x+rect.w>b.x+b.w)score+=(rect.x+rect.w-b.x-b.w)*20;
      if(rect.y+rect.h>b.y+b.h)score+=(rect.y+rect.h-b.y-b.h)*20;
      // 사용자가 지정한 방향을 가장 우선
      if(dir!==(c[2]||'R'))score+=0.2;
      if(!best||score<best.score)best={dir,rect,score};
    }
    const dir=best.dir;
    let tx,ty,anchor;
    if(dir==='R'){tx=x+r+gap;ty=y+fs*.35;anchor='start';}
    else if(dir==='L'){tx=x-r-gap;ty=y+fs*.35;anchor='end';}
    else {tx=x;anchor='middle';ty=dir==='T'?y-r-gap-fs*.1:y+r+gap+fs;}

    const grp=document.createElementNS(svg.namespaceURI,'g');grp.setAttribute('class','marker');grp.dataset.name=s.name;
    grp.innerHTML=`<circle class="bg" cx="${x}" cy="${y}" r="${r}" fill="${col}"/>`+
      `<path transform="translate(${x-2.7*scale},${y-2.7*scale}) scale(${scale*0.54})" fill="#fff" d="M5 1 L0.5 3.2 L5 5.4 L9.5 3.2 Z M2 4.3 V6.6 C2 7.6 3.5 8.4 5 8.4 C6.5 8.4 8 7.6 8 6.6 V4.3 L5 5.9 Z M8.9 3.6 V6.3 H9.6 V3.6 Z"/>`+
      `<text x="${tx}" y="${ty}" text-anchor="${anchor}" style="font-size:${fs}px">${s.short}</text>`;

    grp.addEventListener('mouseleave',()=>highlight(s.name,false));

  });
}

/* ---------- 검색 ---------- */
const subjectCount={};DATA.programs.forEach(p=>{const set=new Set(p.rows.map(r=>r[0]));set.forEach(i=>{subjectCount[i]=(subjectCount[i]||0)+1;});});
const norm=s=>s.replace(/\s+/g,'').toLowerCase();
function runSearch(){
  query=$('#subj').value.trim();
  if(!query){matchedSubjects=null;resultPrograms=[];}
  else{
    const q=norm(query);
    let idx=DATA.subjects.map((s,i)=>i).filter(i=>norm(DATA.subjects[i])===q);
    if(!idx.length)idx=DATA.subjects.map((s,i)=>i).filter(i=>norm(DATA.subjects[i]).includes(q));
    matchedSubjects=new Set(idx);
    resultPrograms=DATA.programs.filter(p=>p.rows.some(r=>matchedSubjects.has(r[0])));
  }
  $('#clearBtn').style.display=query?'':'none';
  closeAC();refreshMap();renderCards();
}
function renderCards(){
  const box=$('#cards');box.innerHTML='';
  let progs=matchedSubjects?resultPrograms:DATA.programs;
  if(selectedGu)progs=progs.filter(p=>p.info.gu===selectedGu);
  const schoolSet=new Set(progs.map(p=>p.school));
  $('#panelTitle').textContent=(selectedGu||'울산광역시 전체')+(matchedSubjects?` · 「${query}」 편성 학교`:'');
  $('#panelCount').textContent=`${schoolSet.size}개교`;
  if(matchedSubjects){
    if(!matchedSubjects.size)setStatus(`「${query}」와 일치하는 과목명이 없습니다. 자동완성 목록을 참고해 주세요.`);
    else{const names=[...matchedSubjects].map(i=>DATA.subjects[i]);setStatus(`검색 과목: ${names.slice(0,8).join(', ')}${names.length>8?` 외 ${names.length-8}개`:''} · ${schoolSet.size}개교 편성`);}
  }else setStatus(selectedGu?`${selectedGu} 고등학교 ${schoolSet.size}개교`:'과목명을 입력하면 해당 과목을 편성한 학교만 표시됩니다.');
  if(!progs.length){box.innerHTML='<div class="empty">조건에 맞는 학교가 없습니다.</div>';return;}
  const coedCls={'남여공학':'coed','남':'boy','여':'girl'};
  progs.forEach(p=>{
    const s=p.info;const card=document.createElement('article');card.className='card';card.dataset.school=s.name;
    let h=`<h3>${p.label}</h3><div class="badges"><span class="badge">${s.gu}</span><span class="sep">|</span><span class="badge">${s.found}</span><span class="sep">|</span><span class="badge ${coedCls[s.coed]||''}">${s.coed}</span><span class="sep">|</span><span class="badge">${s.type}</span></div>`;
    if(matchedSubjects&&matchedSubjects.size){
      const rows=p.rows.filter(r=>matchedSubjects.has(r[0]));
      h+='<div class="courses">'+rows.map(r=>`<div class="course"><span class="sub">${DATA.subjects[r[0]]}</span><span><b>${r[2]}</b>학점</span><div class="meta"><span class="chip cat${r[3]}">${DATA.cats[r[3]]}</span><span class="chip">${DATA.types[r[1]]}과목</span><span class="chip">편성학기 ${r[4].split(',').join(' · ')}</span></div></div>`).join('')+'</div>';
    }
    const hasSim=!!(window.hasSimulator&&window.hasSimulator(p.label));
    h+=`<div class="tap">카드를 누르면 편제표 다운로드와 과목 선택 시뮬레이터를 열 수 있습니다</div>`;
    h+=`<div class="sch-actions">`+
       `<button type="button" class="sch-act dl" data-act="dl">${ICON_DL}편제표 다운로드</button>`+
       `<button type="button" class="sch-act sim" data-act="sim"${hasSim?'':' disabled'}>${ICON_SIM}과목 선택 시뮬레이터</button>`+
       `</div>`;
    card.innerHTML=h;
    if(openSchool===p.label)card.classList.add('open');
    const dlb=card.querySelector('[data-act=dl]'), smb=card.querySelector('[data-act=sim]');
    if(dlb)dlb.addEventListener('click',e=>{e.stopPropagation();window.downloadCurriculum(s.name);});
    if(smb&&!smb.disabled)smb.addEventListener('click',e=>{e.stopPropagation();window.openSimulator(p.label);});
    card.addEventListener('mouseenter',()=>highlight(s.name,true));card.addEventListener('mouseleave',()=>highlight(s.name,false));
    card.addEventListener('click',()=>{
      openSchool=(openSchool===p.label)?'':p.label;
      if(!selectedGu){selectGu(s.gu);setTimeout(()=>highlight(s.name,true),500);}
      else {renderCards();highlight(s.name,true);}
    });
    box.appendChild(card);
  });
}
function setStatus(t){$('#status').textContent=t;}

/* ---------- 자동완성 ---------- */
const ac=$('#ac');let acItems=[],acIdx=-1;
function openAC(){
  const q=norm($('#subj').value);
  if(!q){closeAC();return;}
  acItems=DATA.subjects.map((s,i)=>i).filter(i=>norm(DATA.subjects[i]).includes(q));
  acItems.sort((a,b)=>{
    const sa=norm(DATA.subjects[a]).startsWith(q),sb=norm(DATA.subjects[b]).startsWith(q);
    if(sa!==sb)return sa?-1:1;
    return DATA.subjects[a].localeCompare(DATA.subjects[b],'ko');
  });
  acItems=acItems.slice(0,15);acIdx=-1;
  if(!acItems.length){closeAC();return;}
  const esc=s=>String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  const highlightText=s=>{
    const raw=esc(s), nq=esc($('#subj').value.trim());
    if(!nq)return raw;
    const pos=raw.toLowerCase().indexOf(nq.toLowerCase());
    return pos<0?raw:raw.slice(0,pos)+'<b>'+raw.slice(pos,pos+nq.length)+'</b>'+raw.slice(pos+nq.length);
  };
  ac.innerHTML='<div class="ac-title">관련 과목</div>'+acItems.map(i=>`<div class="ac-item" data-i="${i}"><span class="ac-name">${highlightText(DATA.subjects[i])}</span></div>`).join('');
  ac.style.display='block';
  ac.querySelectorAll('.ac-item').forEach(el=>el.addEventListener('mousedown',e=>{e.preventDefault();$('#subj').value=DATA.subjects[+el.dataset.i];runSearch();}));
}
function closeAC(){ac.style.display='none';acIdx=-1;}
$('#subj').addEventListener('input',openAC);
$('#subj').addEventListener('focus',openAC);
$('#subj').addEventListener('blur',()=>setTimeout(closeAC,150));
$('#subj').addEventListener('keydown',e=>{
  const els=ac.querySelectorAll('.ac-item');
  if(e.key==='ArrowDown'&&els.length){e.preventDefault();acIdx=(acIdx+1)%els.length;els.forEach((el,i)=>el.classList.toggle('active',i===acIdx));els[acIdx].scrollIntoView({block:'nearest'});}
  else if(e.key==='ArrowUp'&&els.length){e.preventDefault();acIdx=(acIdx-1+els.length)%els.length;els.forEach((el,i)=>el.classList.toggle('active',i===acIdx));els[acIdx].scrollIntoView({block:'nearest'});}
  else if(e.key==='Enter'){e.preventDefault();if(acIdx>=0&&els[acIdx])$('#subj').value=DATA.subjects[+els[acIdx].dataset.i];runSearch();}
  else if(e.key==='Escape')closeAC();
});

function applyGeo(geo){
  let feats=geo.type==='FeatureCollection'?geo.features:(geo.type==='Feature'?[geo]:null);
  if(!feats)throw new Error('GeoJSON FeatureCollection 형식이 아닙니다 (TopoJSON은 -geo.json 파일을 사용해 주세요).');
  const found={};
  feats.forEach(ft=>{
    const pr=ft.properties||{};const vals=Object.values(pr).map(v=>String(v));
    let gu=null;
    for(const v of vals){const m=v.match(/^(31\d{3})/);if(m&&CODE2GU[m[1]]){gu=CODE2GU[m[1]];break;}}
    if(!gu){const txt=vals.join(' ');if(/울산/.test(txt)){for(const g of GUS)if(txt.includes(g)){gu=g;break;}}}
    if(!gu)return;
    const gm=ft.geometry;let polys=gm.type==='Polygon'?[gm.coordinates]:(gm.type==='MultiPolygon'?gm.coordinates:[]);
    let rings=[];polys.forEach(pg=>rings.push(pg[0]));
    rings=rings.map(r=>r.map(p=>Math.abs(p[0])>1000?utmkToLonLat(p[0],p[1]):[p[0],p[1]]));
    if(!found[gu])found[gu]={polys:[],label:DIST[gu].label};
    found[gu].polys.push(...rings);
  });
  const missing=GUS.filter(g=>!found[g]);
  if(missing.length)throw new Error('울산 구·군 경계를 찾지 못했습니다: '+missing.join(', ')+' (파일에 행정구역 코드 31xxx 또는 "울산"+구군명이 있어야 합니다)');
  GUS.forEach(g=>{ // 라벨 위치: 가장 큰 폴리곤의 중심 (수동 라벨 위치가 경계 안에 있으면 유지)
    const big=found[g].polys.reduce((a,b)=>b.length>a.length?b:a,found[g].polys[0]);
    const cx=big.reduce((s,p)=>s+p[0],0)/big.length,cy=big.reduce((s,p)=>s+p[1],0)/big.length;
    found[g].label=DIST[g].label||[cx,cy];
  });
  DIST=found;buildMap();if(selectedGu)selectGu(selectedGu);
  
}
/* 구·군 경계 (읍·면·동 경계를 구·군 단위로 병합, WGS84) */
applyGeo(ULSAN_GEO);

/* ---------- 시작 ---------- */
buildMap();renderCards();setStatus('과목명을 입력하면 해당 과목을 편성한 학교만 표시됩니다.');
window.addEventListener('resize',()=>{if(selectedGu)setBox(fitAspect(pad(bboxOf(ringsOf(DIST[selectedGu])),0.12)));else setBox(fitAspect(fullBox));});
})();

<script>
/* ---------- 자동완성 안정화: 검색 입력 즉시 관련 과목 표시 ---------- */
(function(){
  const input=document.getElementById('subj');
  const box=document.getElementById('ac');
  if(!input || !box || typeof DATA==='undefined' || !Array.isArray(DATA.subjects)) return;

  // 기존 입력 이벤트와 충돌하지 않도록 입력창을 복제하여 기존 리스너를 제거합니다.
  const fresh=input.cloneNode(true);
  input.parentNode.replaceChild(fresh,input);

  const norm2=s=>String(s??'').replace(/\s+/g,'').toLowerCase();
  let items=[];
  let active=-1;

  function esc2(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function show(){
    const q=fresh.value.trim();
    const nq=norm2(q);
    if(!nq){ box.innerHTML=''; box.style.display='none'; items=[]; active=-1; return; }

    items=DATA.subjects.map((name,i)=>({name:String(name),i}))
      .filter(o=>norm2(o.name).includes(nq));
    items.sort((a,b)=>{
      const ap=norm2(a.name).startsWith(nq), bp=norm2(b.name).startsWith(nq);
      if(ap!==bp) return ap?-1:1;
      return a.name.localeCompare(b.name,'ko');
    });
    items=items.slice(0,15);
    active=-1;

    if(!items.length){box.innerHTML='';box.style.display='none';return;}

    const countMap=window.subjectCount||{};
    const rows=items.map((o,n)=>{
      const name=esc2(o.name);
      const eq=norm2(o.name).indexOf(nq);
      let shown=name;
      if(eq>=0){
        // 한글 검색어는 공백 제거 전후 길이가 달라질 수 있으므로 단순 강조 처리
        const raw=o.name;
        const p=raw.toLowerCase().indexOf(q.toLowerCase());
        if(p>=0) shown=esc2(raw.slice(0,p))+'<b>'+esc2(raw.slice(p,p+q.length))+'</b>'+esc2(raw.slice(p+q.length));
      }
      return `<div class="ac-item" data-index="${n}" role="option"><span class="ac-name">${shown}</span></div>`;
    }).join('');
    box.innerHTML='<div class="ac-title">관련 과목</div>'+rows;
    box.style.display='block';

    box.querySelectorAll('.ac-item').forEach(el=>{
      el.addEventListener('mousedown',e=>{
        e.preventDefault();
        const o=items[Number(el.dataset.index)];
        if(!o) return;
        fresh.value=o.name;
        box.style.display='none';
        // 검색 버튼의 기존 이벤트를 호출하여 즉시 검색합니다.
        document.getElementById('searchBtn').click();
      });
    });
  }
  function hide(){setTimeout(()=>{box.style.display='none';},180);}

  fresh.addEventListener('input',show);
  fresh.addEventListener('focus',show);
  fresh.addEventListener('blur',hide);
  fresh.addEventListener('keydown',e=>{
    const els=box.querySelectorAll('.ac-item');
    if(e.key==='ArrowDown' && els.length){e.preventDefault();active=(active+1)%els.length;els.forEach((el,i)=>el.classList.toggle('active',i===active));els[active].scrollIntoView({block:'nearest'});}
    else if(e.key==='ArrowUp' && els.length){e.preventDefault();active=(active-1+els.length)%els.length;els.forEach((el,i)=>el.classList.toggle('active',i===active));els[active].scrollIntoView({block:'nearest'});}
    else if(e.key==='Enter' && active>=0 && items[active]){e.preventDefault();fresh.value=items[active].name;box.style.display='none';document.getElementById('searchBtn').click();}
    else if(e.key==='Escape'){box.style.display='none';}
  });

  // 초기화 버튼도 새 입력창을 대상으로 동작하도록 보정
  const clear=document.getElementById('clearBtn');
  if(clear) clear.addEventListener('click',()=>{fresh.value='';box.style.display='none';});
})();
</script>
